; ENSIL 목업 펌웨어 — ESP32-C3 SuperMini / ESP32-CAM
; 하나의 소스(src/main.cpp)를 UNIT 빌드 플래그로 갈라 쓴다.
;   pio run -e unit1 -t upload      # NO.01 십자형 (스위치 → 네오픽셀 17구)
;   pio run -e unit2 -t upload      # NO.02 텐던   (PIR → 서보)
;   pio run -e unit3 -t upload      # NO.03 스피커 (카메라 → 앰프)
; 네트워크/브릿지 주소는 include/config.h
;
; HOST_AP=1 인 env 는 그 보드가 SoftAP(공유기 역할)도 겸한다 — 전시장에 2.4GHz 와이파이가 없을 때
; 한 대만 켠다 (docs/EXHIBITION_SETUP.md §6). 기본은 unit1 이 AP.

[platformio]
default_envs = unit1

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
  gilmaimon/ArduinoWebsockets@^0.5.4
  bblanchon/ArduinoJson@^7.0.0

; ── ESP32-C3 SuperMini 공통 ─────────────────────────────────
[c3]
platform = espressif32
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:unit1]
extends = c3
build_flags = ${c3.build_flags} -DUNIT=1 -DHOST_AP=1
lib_deps = ${env.lib_deps}
  adafruit/Adafruit NeoPixel@^1.12.0

[env:unit2]
extends = c3
build_flags = ${c3.build_flags} -DUNIT=2 -DHOST_AP=0
lib_deps = ${env.lib_deps}
  madhephaestus/ESP32Servo@^3.0.5

; NO.03 — 카메라 보드. AI-Thinker ESP32-CAM 이면 이대로, 다른 보드면 board 만 바꾼다.
; 카메라 감지 코드는 기존 프로젝트 것을 sense() 안에 붙인다.
[env:unit3]
platform = espressif32
board = esp32cam
build_flags = -DUNIT=3 -DHOST_AP=0
lib_deps = ${env.lib_deps}
